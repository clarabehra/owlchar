<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OwlChar</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#777;--blue:#007aff;--their:#e9e9eb;--line:#ddd}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#aaa;--their:#2c2c2e;--line:#3a3a3c}
*{box-sizing:border-box}body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}
#app{width:100%;max-width:430px;height:100vh;margin:auto;background:var(--bg);overflow:hidden;position:relative}
.status{height:28px;padding:7px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.screen{height:calc(100% - 28px);overflow:auto;padding-bottom:78px}.header{padding:15px 18px 12px;font-size:30px;font-weight:750;display:flex;align-items:center;gap:12px}.back{border:0;background:none;font-size:29px;color:var(--blue);padding:0}.iconbtn{border:0;background:none;color:var(--blue);font-size:22px}
.search{margin:0 16px 12px;background:var(--their);border:0;border-radius:11px;padding:9px 12px;width:calc(100% - 32px);font-size:16px;color:var(--text)}
.row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);gap:12px;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#c7d2fe,#fbcfe8);display:grid;place-items:center;font-weight:700;color:#333;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.rowmain{min-width:0;flex:1}.name{font-weight:650}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-size:14px}.time{color:var(--muted);font-size:12px}
.bottom{position:absolute;bottom:0;left:0;right:0;height:76px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.tab{background:none;border:0;color:var(--muted);font-size:11px}.tab.active{color:var(--blue)}.tab span{display:block;font-size:24px;margin-bottom:2px}
.home{padding:28px 24px}.home h1{font-size:34px;margin:0 0 6px}.home p{color:var(--muted)}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}.appicon{border:0;background:none;color:var(--text);font-size:13px}.appicon .sq{width:64px;height:64px;border-radius:16px;margin:auto auto 7px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px #0002;background:var(--card)}
.chat{display:flex;flex-direction:column;height:calc(100% - 28px)}.chathead{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--card)}.chathead .avatar{width:36px;height:36px}.messages{flex:1;overflow:auto;padding:14px 12px 8px}.bubble{max-width:78%;padding:9px 12px;border-radius:18px;margin:6px 0;line-height:1.28;white-space:pre-wrap}.mine{margin-left:auto;background:var(--blue);color:white;border-bottom-right-radius:5px}.theirs{background:var(--their);border-bottom-left-radius:5px}.typing{color:var(--muted);font-size:13px;margin:8px 12px}.composer{display:flex;gap:8px;padding:9px 10px;background:var(--card);border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:10px 13px;font-size:16px}.send{border:0;background:var(--blue);color:#fff;border-radius:20px;padding:0 16px;font-weight:650}
.panel{padding:18px}.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}.label{font-size:12px;color:var(--muted);margin-bottom:6px}.select,.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);font-size:15px;margin-bottom:12px}.btn{border:0;background:var(--blue);color:#fff;padding:11px 16px;border-radius:12px;font-weight:650}.outline{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.profilepic{width:92px;height:92px;border-radius:50%;margin:4px auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#c7d2fe,#fbcfe8);font-size:30px;overflow:hidden}.profilepic img{width:100%;height:100%;object-fit:cover}
.trope{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:8px 11px}.chip.selected{border-color:var(--blue);color:var(--blue)}
.notice{padding:10px 14px;background:#fff3cd;color:#6b5200;font-size:13px;border-radius:12px;margin:12px 16px}
</style>
</head>
<body>
<div id="app"><div class="status"><span id="clock">9:41</span><span>● ◔ ▰</span></div><div id="root"></div></div>
<script>
const chars=[
["draco","Draco Malfoy","D"],["harry","Harry Potter","H"],["hermione","Hermione Granger","H"],["ron","Ron Weasley","R"],["pansy","Pansy Parkinson","P"],["theodore","Theodore Nott","T"],["luna","Luna Lovegood","L"],["ginny","Ginny Weasley","G"],["fred","Fred Weasley","F"],["george","George Weasley","G"],["blaise","Blaise Zabini","B"],["neville","Neville Longbottom","N"],["cedric","Cedric Diggory","C"],["mattheo","Mattheo Riddle","M"]
].map(x=>({id:x[0],name:x[1],initial:x[2]}));
const tropes=["Friends","Best Friends","Classmates","Rivals","Academic Rivals","Enemies","Enemies to Lovers","Friends to Lovers","Secret Crush","Mutual Crush","Fake Dating","Forced Proximity","Childhood Friends","Protective","Jealous","Secret Relationship","Exes","Custom"];
let state=JSON.parse(localStorage.getItem("owlchar")||"null")||{profile:{name:"You",username:"@you",details:"",pic:""},theme:"light",chats:{},groups:[]};
let screen="home",current=null,setupChar="draco",setupTrope="Friends";
const root=document.getElementById("root"),save=()=>localStorage.setItem("owlchar",JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function avatar(c){return `<div class="avatar">${c.id==="user"&&state.profile.pic?`<img src="${state.profile.pic}">`:(c.initial||c.name[0])}</div>`}
function nav(){return `<div class="bottom"><button class="tab ${screen==="home"?"active":""}" onclick="go('home')"><span>⌂</span>Home</button><button class="tab ${screen==="messages"||screen==="chat"?"active":""}" onclick="go('messages')"><span>💬</span>Messages</button><button class="tab ${screen==="roleplay"?"active":""}" onclick="go('roleplay')"><span>🎭</span>Roleplay</button><button class="tab ${screen==="profile"?"active":""}" onclick="go('profile')"><span>◉</span>Profile</button></div>`}
function go(s){screen=s;current=null;render()}
function render(){document.getElementById("app").dataset.theme=state.theme;if(screen==="home")home();else if(screen==="messages")messages();else if(screen==="setup")setup();else if(screen==="chat")chat();else if(screen==="roleplay")roleplay();else if(screen==="profile")profile()}
function home(){root.innerHTML=`<div class="screen home"><h1>OwlChar</h1><p>Your phone. Your characters. Your story.</p><div class="apps"><button class="appicon" onclick="go('messages')"><div class="sq">💬</div>Messages</button><button class="appicon" onclick="go('roleplay')"><div class="sq">🎭</div>IRL Roleplay</button><button class="appicon" onclick="go('profile')"><div class="sq">👤</div>Profile</button></div></div>${nav()}`}
function messages(){root.innerHTML=`<div class="screen"><div class="header">Messages <button class="iconbtn" style="margin-left:auto" onclick="newChat()">＋</button></div><input class="search" placeholder="Search" oninput="filterChats(this.value)"><div id="chatlist">${chars.map(row).join("")}</div></div>${nav()}`}
function row(c){let a=state.chats[c.id],last=a?.messages?.at(-1);return `<div class="row" onclick="start('${c.id}')">${avatar(c)}<div class="rowmain"><div class="name">${c.name}</div><div class="preview">${last?esc(last.text):"Start a conversation"}</div></div><div class="time">${last?"Now":""}</div></div>`}
function filterChats(q){document.getElementById("chatlist").innerHTML=chars.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(row).join("")}
function newChat(){setupChar=chars[0].id;setupTrope="Friends";screen="setup";render()}
function start(id){setupChar=id;setupTrope=state.chats[id]?.trope||"Friends";screen="setup";render()}
function setup(){let c=chars.find(x=>x.id===setupChar);root.innerHTML=`<div class="screen"><div class="header"><button class="back" onclick="go('messages')">‹</button>New Chat</div><div class="panel"><div class="card"><div style="display:flex;align-items:center;gap:12px">${avatar(c)}<h2>${c.name}</h2></div><div class="label">Relationship dynamic</div><div class="trope">${tropes.map(t=>`<button class="chip ${t===setupTrope?"selected":""}" onclick="pick('${esc(t)}')">${t}</button>`).join("")}</div><button class="btn" style="margin-top:16px" onclick="begin()">Start Chat</button></div></div></div>`}
function pick(t){setupTrope=t;setup()}
function begin(){state.chats[setupChar]??={messages:[],trope:setupTrope,memory:[]};state.chats[setupChar].trope=setupTrope;save();current=setupChar;screen="chat";render()}
function chat(){let c=chars.find(x=>x.id===current),a=state.chats[current]?.messages||[];root.innerHTML=`<div class="chat"><div class="chathead"><button class="back" onclick="go('messages')">‹</button>${avatar(c)}<div><div class="name">${c.name}</div><small>${state.chats[current]?.trope||"Friends"}</small></div></div><div class="messages" id="msgs">${a.map(m=>`<div class="bubble ${m.me?"mine":"theirs"}">${esc(m.text)}</div>`).join("")}</div><div class="typing hidden" id="typing">${c.name} is typing…</div><form class="composer" onsubmit="send(event)"><input id="input" autocomplete="off" placeholder="Message ${c.name}"><button class="send">Send</button></form></div>`;setTimeout(()=>{let x=document.getElementById("msgs");if(x)x.scrollTop=x.scrollHeight},0)}
function send(e){e.preventDefault();let inp=document.getElementById("input"),text=inp.value.trim();if(!text)return;let a=state.chats[current];a.messages.push({me:true,text});save();chat();document.getElementById("typing").classList.remove("hidden");setTimeout(()=>{let c=chars.find(x=>x.id===current);a.messages.push({me:false,text:demo(c,text)});save();chat()},650)}
function demo(c,text){let l=text.toLowerCase();if(c.id==="draco")return l.includes("why")?`*Draco raised an eyebrow.*\n\n"Because apparently you enjoy asking questions you already know the answer to."`:l.includes("sorry")?`*His expression softened for a moment.*\n\n"Fine. I'll accept the apology. Don't make me regret it."`:`*Draco looked at you, clearly considering your words.*\n\n"Interesting. And what exactly am I supposed to do with that information?"`;if(c.id==="hermione")return `*Hermione tilted her head, thinking it over.*\n\n"I understand what you're saying. But I think there's more to it than that. What happened next?"`;if(c.id==="harry")return `*Harry gave you a small smile.*\n\n"Okay, I hear you. But tell me what you actually want to happen."`;if(c.id==="luna")return `*Luna looked thoughtful for a moment.*\n\n"That is rather interesting. I don't think I'd ignore that feeling."`;return `*${c.name} looked at you for a moment.*\n\n"I wasn't expecting you to say that. Tell me more."`}
function roleplay(){root.innerHTML=`<div class="screen"><div class="header">IRL Roleplay</div><div class="panel"><div class="card"><div class="label">Character</div><select class="select" id="rpc">${chars.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</select><div class="label">Relationship</div><select class="select" id="rpt">${tropes.map(t=>`<option>${t}</option>`).join("")}</select><div class="label">Location</div><input class="field" id="rpl" value="Hogwarts library"><div class="label">Situation</div><textarea class="field" id="rps" rows="3" placeholder="Describe the situation..."></textarea><button class="btn" onclick="startRP()">Enter scene</button></div><div class="notice">You control your character. The character reacts to your actions and dialogue.</div></div></div>${nav()}`}
function startRP(){let id=document.getElementById("rpc").value,c=chars.find(x=>x.id===id),loc=document.getElementById("rpl").value,s=document.getElementById("rps").value||"You encounter each other unexpectedly.";root.innerHTML=`<div class="chat"><div class="chathead"><button class="back" onclick="go('roleplay')">‹</button>${avatar(c)}<div><div class="name">${c.name}</div><small>${loc}</small></div></div><div class="messages" id="rpmsgs"><div class="bubble theirs">*${c.name} noticed you and waited for you to speak.*\n\n"${c.id==="draco"?"Well?":"What do you say?"}"</div></div><form class="composer" onsubmit="rpSend(event,'${id}')"><input id="rpinput" placeholder="Say or do something…"><button class="send">Send</button></form></div>`}
function rpSend(e,id){e.preventDefault();let i=document.getElementById("rpinput"),t=i.value.trim();if(!t)return;let b=document.getElementById("rpmsgs"),c=chars.find(x=>x.id===id);b.innerHTML+=`<div class="bubble mine">${esc(t)}</div><div class="bubble theirs">*${c.name} reacted directly to what you just said.*\n\n"${id==="draco"?"You really thought that was going to work?":"I didn't expect you to say that. Tell me more."}"</div>`;i.value="";b.scrollTop=b.scrollHeight}
function profile(){let p=state.profile;root.innerHTML=`<div class="screen"><div class="header">Profile</div><div class="panel"><div class="card"><div class="profilepic">${p.pic?`<img src="${p.pic}">`:"👤"}</div><input type="file" accept="image/*" class="field" onchange="pic(event)"><div class="label">Name</div><input class="field" id="pn" value="${esc(p.name)}"><div class="label">Username</div><input class="field" id="pu" value="${esc(p.username)}"><div class="label">Appearance & details</div><textarea class="field" id="pd" rows="5" placeholder="Hair, eyes, personality, interests...">${esc(p.details)}</textarea><button class="btn" onclick="saveP()">Save Profile</button></div><div class="card"><button class="btn outline" onclick="theme()">Switch to ${state.theme==="light"?"dark":"light"} mode</button></div></div></div>${nav()}`}
function pic(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.profile.pic=r.result;save();profile()};r.readAsDataURL(f)}
function saveP(){state.profile.name=document.getElementById("pn").value||"You";state.profile.username=document.getElementById("pu").value||"@you";state.profile.details=document.getElementById("pd").value;save();profile()}
function theme(){state.theme=state.theme==="light"?"dark":"light";save();render()}
setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),1000);render();
</script>
</body>
</html>
